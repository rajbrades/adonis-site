<style>
  /* shared specimen styles for the brand directions */
  .spec-frame {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
  }
  .spec-frame *, .spec-frame *::before, .spec-frame *::after { box-sizing: border-box; }
  .spec-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 0;
    width: 100%;
    height: 100%;
  }
  .spec-grid > .left, .spec-grid > .right {
    padding: 56px;
    overflow: hidden;
  }
  .spec-grid > .right {
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  /* swatch row */
  .swatches {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }
  .swatch {
    aspect-ratio: 1/1.1;
    border-radius: 4px;
    position: relative;
    border: 1px solid rgba(0,0,0,0.06);
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    padding: 8px;
  }
  .swatch .lbl {
    font-family: ui-monospace, "JetBrains Mono", monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1.2;
  }
  /* dot grid micro-illustration on swatches */
  .swatch.tex::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(currentColor 0.5px, transparent 0.5px);
    background-size: 8px 8px;
    opacity: 0.07;
  }

  .kicker {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .kicker::before {
    content: "";
    width: 24px;
    height: 1px;
    background: currentColor;
    opacity: 0.5;
  }

  .meta-row {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.55;
  }

  /* placeholder image */
  .ph {
    width: 100%;
    aspect-ratio: 4/5;
    background: var(--ph-bg, #1a1a1a);
    border: 1px solid var(--line);
    position: relative;
    overflow: hidden;
  }
  .ph::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      135deg,
      transparent 0 12px,
      rgba(255,255,255,0.04) 12px 13px
    );
  }
  .ph .ph-lbl {
    position: absolute;
    bottom: 14px;
    left: 14px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.7;
  }

  /* ============== A — DARK LUXURY PERFORMANCE MEDICINE ============== */
  .dir-a {
    --bg:    #0E0E10;
    --bg2:   #16161A;
    --fg:    #EDE7DA;     /* warm off-white */
    --mute:  #8A847A;
    --line:  rgba(237, 231, 218, 0.10);
    --line2: rgba(237, 231, 218, 0.16);
    --acc:   #B58A4D;     /* desaturated bronze */
    --acc2:  #D7BC8A;     /* champagne */
    --oxblood: #5A2A2A;
    --ph-bg: #0a0a0c;
    color: var(--fg);
    background: var(--bg);
    font-family: "Inter Tight", "Inter", system-ui, sans-serif;
  }
  .dir-a .display {
    font-family: "Cormorant Garamond", "EB Garamond", "Fraunces", serif;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .dir-a .display em { font-style: italic; font-weight: 300; color: var(--acc2); }
  .dir-a .swatches { color: var(--fg); }
  .dir-a .acc { color: var(--acc); }
  .dir-a .acc2 { color: var(--acc2); }

  /* ============== B — EDITORIAL CLINICAL OPTIMIZATION ============== */
  .dir-b {
    --bg:    #F4EFE6;     /* warm ivory */
    --bg2:   #EDE6D7;
    --fg:    #1F1D1A;     /* charcoal */
    --mute:  #7A736A;
    --line:  rgba(31, 29, 26, 0.12);
    --line2: rgba(31, 29, 26, 0.22);
    --acc:   #8B6F4E;     /* taupe-bronze */
    --acc2:  #C9A77A;     /* champagne */
    --secondary: #2E3B30; /* deep clinical green */
    --ph-bg: #d8cfc0;
    color: var(--fg);
    background: var(--bg);
    font-family: "Inter Tight", "Inter", system-ui, sans-serif;
  }
  .dir-b .display {
    font-family: "Lora", "EB Garamond", serif;
    font-weight: 400;
    letter-spacing: -0.015em;
  }
  .dir-b .display em { font-style: italic; font-weight: 400; color: var(--acc); }
  .dir-b .acc { color: var(--acc); }
  .dir-b .secondary { color: var(--secondary); }

  /* ============== C — MODERN PREMIUM TELEHEALTH ============== */
  .dir-c {
    --bg:    #FAF8F4;     /* soft stone */
    --bg2:   #F1ECE3;
    --fg:    #1A1A1A;
    --mute:  #6F6A62;
    --line:  rgba(26, 26, 26, 0.10);
    --line2: rgba(26, 26, 26, 0.20);
    --acc:   #2A2A2A;     /* near-black primary */
    --acc2:  #9A7B4F;     /* refined bronze accent */
    --slate: #3A4250;
    --ph-bg: #2a2a2a;
    color: var(--fg);
    background: var(--bg);
    font-family: "Inter Tight", "Inter", system-ui, sans-serif;
  }
  .dir-c .display {
    font-family: "Playfair Display", "Fraunces", serif;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .dir-c .display em { font-style: italic; font-weight: 400; color: var(--acc2); }
  .dir-c .acc2 { color: var(--acc2); }

  /* ===== Shared component skeletons ===== */
  .nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 56px;
    border-bottom: 1px solid var(--line);
    height: 72px;
  }
  .brand-mark {
    font-family: "Cormorant Garamond", "Lora", "Playfair Display", serif;
    font-size: 26px;
    letter-spacing: 0.16em;
    font-weight: 400;
  }
  .brand-mark .ad { letter-spacing: 0.34em; font-weight: 400; }
  .nav-links {
    display: flex;
    gap: 32px;
    font-size: 13px;
    letter-spacing: 0.04em;
  }
  .nav-links a { color: inherit; opacity: 0.85; text-decoration: none; }

  /* CTA */
  .cta-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .cta-pri, .cta-sec, .cta-out {
    font-family: "Inter Tight", "Inter", system-ui, sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 14px 22px;
    border-radius: 0;
    cursor: pointer;
    border: 1px solid currentColor;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-weight: 500;
    background: transparent;
  }

  /* ============== HERO LAYOUT ============== */
  .hero-block {
    padding: 64px 56px 56px;
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 48px;
    align-items: end;
    border-bottom: 1px solid var(--line);
  }
  .hero-headline {
    font-size: clamp(56px, 8.5vw, 132px);
    line-height: 0.95;
    text-wrap: balance;
    max-width: 12ch;
    margin-top: 28px;
  }
  .hero-sub {
    font-size: 17px;
    line-height: 1.5;
    max-width: 42ch;
    color: var(--mute);
    margin-bottom: 32px;
  }

  /* ============== PRODUCT CARD ============== */
  .pc {
    background: var(--bg2);
    border: 1px solid var(--line);
    padding: 0;
    display: flex;
    flex-direction: column;
  }
  .pc .pc-img {
    aspect-ratio: 4/3.4;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pc .pc-body {
    padding: 24px 24px 20px;
  }
  .pc .pc-cat {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--mute);
    margin-bottom: 12px;
  }
  .pc .pc-title {
    font-size: 28px;
    line-height: 1.05;
  }
  .pc .pc-desc {
    font-size: 13px;
    color: var(--mute);
    margin-top: 12px;
    line-height: 1.5;
  }
  .pc .pc-foot {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .pc .pc-price {
    font-size: 26px;
    font-weight: 400;
  }

  /* ============== CHART ============== */
  .chart-card {
    background: var(--bg2);
    border: 1px solid var(--line);
    padding: 28px;
  }
  .chart-card .chart-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }
  .chart-card .chart-h {
    font-size: 22px;
    line-height: 1.1;
  }

  /* type stack */
  .type-stack { display: flex; flex-direction: column; gap: 4px; }

  /* row of small product photos */
  .ph-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .ph-row .ph { aspect-ratio: 1/1.1; }
  .ph-row .ph .ph-lbl { font-size: 8px; }

  /* footer of artboard */
  .ab-foot {
    padding: 20px 56px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--mute);
  }
</style>
</head>

<script type="text/babel">

  // Reusable micro chart
  const MicroChart = ({ accent = "#B58A4D", muted = "#888", line = "rgba(0,0,0,0.1)", text = "#222", baselineLabel = "BASELINE" }) => (

  /* =====================================================================
