name: Copy lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  banned-phrases:
    name: Banned-phrase scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run banned-phrase lint
        run: npm run lint:copy
